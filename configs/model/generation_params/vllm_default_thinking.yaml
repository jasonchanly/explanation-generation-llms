# Using recommended params "Thinking mode for general tasks" from https://huggingface.co/Qwen/Qwen3.5-4B
defaults:
  - vllm_default_instruct
  - _self_

temperature: 1.0
top_p: 0.95
# 256 (max_tokens for instruct) + 16 (headroom for triggering answer) = 272
max_tokens: ${add:${model.generation_params.extra_body.thinking_token_budget},272}

extra_body:
  thinking_token_budget: 7920
  chat_template_kwargs:
    enable_thinking: true